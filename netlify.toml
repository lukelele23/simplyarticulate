[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Public frontend URL; keep scanning enabled for actual credentials.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL"
  # Publish plan information while checkout remains disabled.
  VITE_BILLING_ENABLED = "false"
  # Public Paddle.js settings; these are safe to include in the browser.
  VITE_PADDLE_ENVIRONMENT = "production"
  VITE_PADDLE_CLIENT_TOKEN = "live_7b4adbf7135c82bed455b78d0cc"
  VITE_PADDLE_PRO_MONTH_PRICE_ID = "pri_01m51kmkks1f042pbk3m4d60vq"
  VITE_PADDLE_PRO_YEAR_PRICE_ID = "pri_01m51kmkpe87642qajgbmwypba"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.paddle.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://vyssmktvorjpubfzihmz.supabase.co wss://vyssmktvorjpubfzihmz.supabase.co https://*.paddle.com; frame-src 'self' https://*.paddle.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
